<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="메이플스토리 캐릭터 닉네임으로 스펙을 불러와 보스 실딜·억당 효율 기준으로 업그레이드 순서를 계산해요." />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M16 7.5 23.5 16 16 24.5 8.5 16Z' fill='%23f2b84b'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>메이플 장비 최적화</title>
    <script>
      // 첫 그리기 전에 저장된 테마를 적용해 깜빡임을 막는다(theme.js와 같은 키)
      try { var t = localStorage.getItem("maple-optimizer:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

# PC가 꺼져도 Claude Code가 이 저장소에서 작업한다(2026-10-07).
# - 이슈·PR 댓글에 @claude 로 지시 → 클라우드에서 작업하고 커밋·푸시
# - Actions 탭 "claude" → Run workflow 에 지시문 입력
# - 매일 09:00(KST) GOALS.md에 자동 목표(TODO/DOING)가 남아 있을 때만 이어서 진행(없으면 Claude를 부르지 않는다)
# 준비(사람): 저장소 Secrets에 CLAUDE_CODE_OAUTH_TOKEN(claude setup-token 결과), https://github.com/apps/claude 설치.
# 앱으로 푸시해야 test-build-deploy 워크플로가 이어서 돈다(GITHUB_TOKEN 푸시는 다른 워크플로를 깨우지 않는다).
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Claude에게 맡길 일(비우면 GOALS.md의 남은 자동 목표를 이어서 진행)"
        required: false
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC = 09:00 KST

concurrency:
  group: claude-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pending:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      goals: ${{ steps.scan.outputs.goals }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        name: 남은 자동 목표 찾기
        run: |
          goals=$(python3 - <<'PY'
          import re
          out = []
          for line in open("GOALS.md", encoding="utf-8"):
              cells = [c.strip() for c in line.strip().strip("|").split("|")]
              if len(cells) >= 5 and re.fullmatch(r"G\d+", cells[0]) and cells[-2] == "자동":
                  if cells[-1].split()[0] in ("TODO", "DOING"):
                      out.append(cells[0])
          print(",".join(out))
          PY
          )
          echo "goals=$goals" >> "$GITHUB_OUTPUT"
          echo "남은 자동 목표: ${goals:-없음}"

  claude:
    needs: [pending]
    # 댓글·이슈는 @claude가 있을 때만, 예약 실행은 남은 목표가 있을 때만, 수동 실행은 지시문이나 남은 목표가 있을 때만
    if: |
      always() && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'schedule' && needs.pending.outputs.goals != '') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.prompt != '' || needs.pending.outputs.goals != ''))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 의존성 설치(테스트용)
        run: |
          uv sync
          npm --prefix web ci
      - id: p
        name: 지시문 만들기(예약·수동 실행만 — 댓글·이슈는 비워서 대화 모드)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TASK: ${{ github.event.inputs.prompt }}
          GOALS: ${{ needs.pending.outputs.goals }}
        run: |
          if [ -z "$TASK" ]; then
            TASK="GOALS.md에 남은 자동 목표($GOALS)를 이어서 진행한다. 목표마다 성공 기준(숫자)을 판정 테스트로 먼저 쓰고 실패를 확인한 뒤 구현한다. 같은 판정이 3번 연속 실패하면 그 목표를 BLOCKED로 적고 이유를 goal-log.md에 남긴 뒤 다음으로 간다. 성공 기준은 낮추지 않는다."
          fi
          {
            echo "prompt<<__END_OF_PROMPT__"
            echo "$TASK"
            echo
            cat .github/claude-rules.md
            echo "__END_OF_PROMPT__"
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.p.outputs.prompt }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,TodoWrite"

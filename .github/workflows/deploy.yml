name: test-build-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q --ignore=tests/goals
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix web ci
      - run: npm --prefix web test

  smoke:
    # 컨테이너가 실제로 뜨는지: 플랫폼이 주는 PORT(Render는 10000)로 /api/health 200 (2026-10-07)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maple-optimizer:smoke .
      - run: docker run -d --name smoke -e PORT=10000 -e NEXON_API_KEY=dummy -p 10000:10000 maple-optimizer:smoke
      - name: /api/health 200
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

  image:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/maple-optimizer:latest

  deploy:
    needs: image
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}   # 서버 준비(H1) 전에는 배포 단계를 건너뛴다
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/maple-optimizer
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            IMAGE=ghcr.io/${{ github.repository_owner }}/maple-optimizer:latest docker compose pull api
            IMAGE=ghcr.io/${{ github.repository_owner }}/maple-optimizer:latest docker compose up -d

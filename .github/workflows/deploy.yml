name: test-build-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q --ignore=tests/goals
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix web ci
      - run: npm --prefix web test

  smoke:
    # 컨테이너가 실제로 뜨는지: 플랫폼이 주는 PORT(Render는 10000)로 /api/health 200 (2026-10-07)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maple-optimizer:smoke .
      - run: docker run -d --name smoke -e PORT=10000 -e NEXON_API_KEY=dummy -p 10000:10000 maple-optimizer:smoke
      - name: /api/health 200
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

  image:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/maple-optimizer:latest

  deploy:
    # AWS Lightsail(서울) 서버 갱신(2026-10-17). 이미지는 비공개 ghcr — 이 잡의 일회용 GITHUB_TOKEN으로 받는다(따로 만든 토큰 없음)
    needs: image
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}   # 서버 준비 전에는 배포 단계를 건너뛴다
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,OWNER,DEPLOY_DOMAIN
          script: |
            set -e
            cd ~/maple-optimizer
            git pull --ff-only                     # docker-compose.yml·Caddyfile 변경도 따라간다
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE="ghcr.io/$OWNER/maple-optimizer:latest" DOMAIN="$DEPLOY_DOMAIN"
            docker compose pull api
            docker compose up -d
            docker logout ghcr.io                  # 일회용 토큰이라도 서버에 남기지 않는다
            docker image prune -f
      - name: 배포 뒤 /api/health 200
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DEPLOY_DOMAIN/api/health"; then exit 0; fi
            sleep 5
          done
          echo "배포 뒤 서버가 응답하지 않아요: https://$DEPLOY_DOMAIN"
          exit 1

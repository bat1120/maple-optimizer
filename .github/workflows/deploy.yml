name: test-build-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .   # 버그 규칙만(pyproject.toml [tool.ruff.lint])
      - run: uv run pytest -q --ignore=tests/goals -n auto   # 병렬(pytest-xdist)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix web ci
      - run: npm --prefix web test

  evidence:
    # 화면 검증 증거: 픽스처 서버로 실제 앱을 띄워 기능 지도대로 확인하고 찍는다(tools/verify_ui). 결과는 Artifacts의 ui-evidence.
    # 아직 배포를 막지 않는다(continue-on-error) — 러너에서 안정적으로 도는 게 확인되면 image의 needs에 넣는다.
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix web ci
      - run: node tools/verify_ui/run.mjs --out ui-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence
          path: ui-evidence

  smoke:
    # 컨테이너가 실제로 뜨는지: 플랫폼이 주는 PORT(Render는 10000)로 /api/health 200 (2026-10-07)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maple-optimizer:smoke .
      - run: docker run -d --name smoke -e PORT=10000 -e NEXON_API_KEY=dummy -p 10000:10000 maple-optimizer:smoke
      - name: /api/health 200
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - name: 로컬 OCR이 서버 사용자(root 아님)로 글자를 읽는다
        # 2026-11-25: 운영에서 첫 툴팁에 PermissionError — 글자 모델이 이미지에 없어 서버가 받으려다 실패했고, 모든 판독이 AI로 갔다
        run: |
          cat > /tmp/ocr_check.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from server.ocr import reader
          read = reader()
          assert read, "OCR 꺼짐"
          im = Image.new("RGB", (320, 80), (40, 46, 52))
          ImageDraw.Draw(im).text((12, 16), "Lv. 200  STR +12%", font=ImageFont.load_default(30), fill=(255, 255, 255))
          got = read(im)
          print(got)
          assert any("200" in t for _, _, t in got), got
          PY
          docker cp /tmp/ocr_check.py smoke:/tmp/ocr_check.py
          docker exec --user app --workdir /app smoke /app/.venv/bin/python /tmp/ocr_check.py

  image:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 멈추면 6시간 기다리지 않고 바로 실패(평소 5분 안팎)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          # 커밋 해시 태그도 붙인다 — 배포는 해시로, 문제가 생기면 이전 해시로 되돌린다(2026-10-17)
          tags: |
            ghcr.io/${{ github.repository_owner }}/maple-optimizer:latest
            ghcr.io/${{ github.repository_owner }}/maple-optimizer:${{ github.sha }}

  deploy:
    # AWS Lightsail(서울) 서버 갱신(2026-10-17). 이미지는 비공개 ghcr — 이 잡의 일회용 GITHUB_TOKEN으로 받는다(따로 만든 토큰 없음)
    needs: image
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}   # 서버 준비 전에는 배포 단계를 건너뛴다
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,OWNER,DEPLOY_DOMAIN,SHA
          script: |
            set -e
            cd ~/maple-optimizer
            git pull --ff-only                     # docker-compose.yml·Caddyfile 변경도 따라간다
            REPO="ghcr.io/$OWNER/maple-optimizer"
            NEW="$REPO:$SHA"
            PREV=$(cat .deployed-image 2>/dev/null || true)   # 지난번에 잘 뜬 이미지(되돌릴 곳)
            export DOMAIN="$DEPLOY_DOMAIN"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE="$NEW" docker compose pull api
            docker logout ghcr.io                  # 일회용 토큰이라도 서버에 남기지 않는다
            IMAGE="$NEW" docker compose up -d
            ok=""
            for i in $(seq 1 18); do               # compose healthcheck가 healthy가 될 때까지 최대 90초
              st=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || true)
              if [ "$st" = "healthy" ]; then ok=1; break; fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "새 이미지가 healthy가 되지 않아 이전 이미지로 되돌려요: ${PREV:-없음}"
              if [ -n "$PREV" ]; then IMAGE="$PREV" docker compose up -d; fi
              exit 1
            fi
            echo "$NEW" > .deployed-image
            # 최근 3개 이미지만 남긴다(되돌릴 여지는 남기고 디스크는 채우지 않게)
            docker images "$REPO" --format '{{.CreatedAt}}|{{.Repository}}:{{.Tag}}' | sort -r | tail -n +4 \
              | cut -d'|' -f2 | grep -v ':latest$' | xargs -r docker rmi || true
            # 매일 DB 백업(cron) — 없으면 넣는다
            ( crontab -l 2>/dev/null | grep -v 'deploy/backup.sh'; \
              echo "30 4 * * * bash $HOME/maple-optimizer/deploy/backup.sh >> $HOME/backups/backup.log 2>&1" ) | crontab -
      - name: 배포 뒤 /api/health 200
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DEPLOY_DOMAIN/api/health"; then exit 0; fi
            sleep 5
          done
          echo "배포 뒤 서버가 응답하지 않아요: https://$DEPLOY_DOMAIN"
          exit 1

[project]
name = "maple-optimizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.27",
    "openai>=3.24.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
]
analysis = ["scipy>=1.13", "numpy>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "nexon", "server", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
